<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园报修 · CampusFlow</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#183d3a;background:#f5f6f1;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer;border:1px solid #c5d5cf;border-radius:8px;padding:10px 15px;background:white;color:#184c44}button:hover{background:#edf4ef}button:disabled{cursor:wait;opacity:.55}button.primary{background:#19594c;color:white;border-color:#19594c}a{color:#19594c}header{background:#173e38;color:#fff;padding:26px max(22px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header a{color:#dfece1}h1{font-size:26px;margin:5px 0}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px;margin:0 0 12px}.eyebrow{font-size:12px;letter-spacing:2px;color:#abc9bd}main{max-width:1120px;margin:25px auto;padding:0 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}nav button[aria-selected=true]{background:#dce9dc;border-color:#739686}section.panel{background:#fff;border:1px solid #dde4db;border-radius:12px;padding:24px;margin:18px 0;box-shadow:0 4px 20px #173e3804}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px}.muted{color:#60766f;line-height:1.7}.notice{border-left:4px solid #a67c2b;background:#fff8e6;padding:13px 18px;line-height:1.7;margin:14px 0;white-space:pre-wrap}.notice.error{border-color:#a34336;background:#fff0ec}.notice.good{border-color:#28775d;background:#eaf6ec}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;gap:7px;margin:13px 0;font-size:14px}input,select,textarea{width:100%;border:1px solid #b9c9c1;background:#fff;border-radius:7px;padding:11px;color:#183d3a}textarea{resize:vertical;min-height:100px}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:14px}.filters label{min-width:150px;flex:1}.cards{display:grid;gap:14px;margin:18px 0}.card{border:1px solid #d6e2d9;border-radius:10px;padding:18px}.card-top,.actions{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:10px}.actions{justify-content:flex-start;margin-top:15px}.badge{display:inline-block;background:#e7f0e8;color:#285c49;padding:5px 9px;border-radius:5px;font-size:12px}.metadata{font-size:13px;line-height:1.8;color:#5d736a;overflow-wrap:anywhere}.sync{font-size:13px;border-top:1px dashed #d9e2da;margin-top:12px;padding-top:10px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#f0f5ee;padding:18px;border-radius:8px}.stat strong{display:block;font-size:26px;margin-top:8px}dialog{border:1px solid #cbd9cf;border-radius:14px;padding:26px;width:min(720px,94vw);max-height:88vh;color:#183d3a}dialog::backdrop{background:#183d3a60}dialog .close{float:right}ol.timeline{padding-left:24px}li{margin:12px 0;line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.empty{padding:35px 10px;text-align:center;color:#6a7f73;border:1px dashed #ccd9cf;border-radius:8px}[hidden]{display:none!important}@media(max-width:680px){header{align-items:flex-start}.grid,.stats{grid-template-columns:1fr}.intro{display:block}.panel{padding:18px!important}.filters{display:block}.filters label{width:100%}h1{font-size:23px}}
</style></head>
<body>
<header><div><div class="eyebrow">CAMPUSFLOW / M3</div><h1>校园设施报修</h1><div>从故障上报，到维修验收</div></div><div><p id="identity">正在连接…</p><a href="/">返回首页</a></div></header>
<main>
<div class="intro"><div><h2>让每一处故障都有进展</h2><p class="muted">查看工单当前阶段，跟进维修与验收结果。</p></div><span class="badge">物业服务</span></div>
<div id="notice" role="status" aria-live="polite" hidden></div><div id="pending" hidden class="notice"></div>
<nav aria-label="报修功能" role="tablist" id="tabs" hidden>
<button data-tab="report" role="tab">提交报修</button><button data-tab="orders" role="tab">工单查询</button><button data-tab="tasks" role="tab">处理任务</button><button data-tab="dispatch" role="tab">派单管理</button><button data-tab="stats" role="tab">维修统计</button>
</nav>
<section class="panel" id="report" hidden><h2>提交新的报修</h2><p class="muted">选择教室，并描述故障的具体位置和现象。</p><form id="report-form"><label>报修教室<select id="report-space" required><option value="">正在加载教室…</option></select></label><label>具体位置<input id="fault-location" required maxlength="2000" placeholder="例如：进门左侧第二盏灯"></label><label>故障描述<textarea id="description" required maxlength="2000" placeholder="描述你发现的问题"></textarea></label><button class="primary" type="submit">提交报修</button></form></section>
<section class="panel" id="orders" hidden><h2>工单查询</h2><form id="orders-form" class="filters"><label>查看范围<select id="view"><option value="OWN">我上报的</option><option value="ASSIGNED">分配给我的</option><option value="MANAGED">管理范围内</option></select></label><label>阶段<select id="order-status"><option value="">全部阶段</option></select></label><label>开始日期<input id="order-from" type="date"></label><label>结束日期（不含）<input id="order-to" type="date"></label><button class="primary">查询</button></form><div class="cards" id="orders-list"></div><button id="orders-next" hidden>加载更多工单</button></section>
<section class="panel" id="tasks" hidden><h2>处理任务</h2><form id="tasks-form" class="filters"><label>任务类型<select id="purpose"></select></label><button class="primary">刷新任务</button></form><div class="cards" id="tasks-list"></div><button id="tasks-next" hidden>加载更多任务</button></section>
<section class="panel" id="dispatch" hidden><h2>待派单工单</h2><p class="muted">查看故障描述，选择具备该教室维修资格的承接人。</p><button id="dispatch-refresh">刷新待派单</button><div class="cards" id="dispatch-list"></div><button id="dispatch-next" hidden>加载更多待派单</button></section>
<section class="panel" id="stats" hidden><h2>维修统计</h2><p class="muted">按工单上报时间统计。维修时长包含待验收和返修时间。</p><form id="stats-form" class="filters"><label>开始日期<input id="stats-from" type="date" required></label><label>结束日期（不含）<input id="stats-to" type="date" required></label><button class="primary">查看统计</button></form><div id="stats-result"></div></section>
<dialog id="action-dialog"><button class="close" type="button" id="dialog-close">关闭</button><h2 id="dialog-title"></h2><div id="dialog-content"></div></dialog>
</main><script type="module" src="./app.js"></script></body></html>
