<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>登录 · CampusFlow 校园服务</title>
  <link rel="stylesheet" href="/shared/d.css">
  <script type="module" src="/shared/d-pages.js"></script>
</head>
<body data-page="login">
  <main class="login-layout">
    <section class="welcome" aria-labelledby="welcome-title">
      <a class="brand" href="/" aria-label="CampusFlow 首页"><span class="brand-mark" aria-hidden="true">C</span>CampusFlow<span class="brand-caption">校园服务</span></a>
      <div class="welcome-copy">
        <p class="eyebrow">让校园日常，更有条理</p>
        <h1 id="welcome-title">一个入口，<br>连接校园生活。</h1>
        <p class="intro">找一个专注的座位，安排下一场活动，<br class="wide-only">让需要维修的地方得到照顾。</p>
        <ul class="service-list">
          <li><span class="number">01</span><span>自习座位<span class="sub">预约 · 签到 · 使用记录</span></span></li>
          <li><span class="number">02</span><span>教室预约<span class="sub">活动申请 · 审批进度</span></span></li>
          <li><span class="number">03</span><span>物业报修<span class="sub">故障上报 · 维修跟进</span></span></li>
        </ul>
      </div>
      <p class="welcome-footer">CAMPUSFLOW / 校园公共服务</p>
    </section>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-card">
        <p class="eyebrow accent">欢迎回来</p>
        <h2 id="login-title">登录校园账号</h2>
        <p class="muted">使用已分配的账号和密码继续。</p>
        <div id="message" class="message" role="status" aria-live="polite" hidden></div>
        <button id="retry" class="secondary" type="button" hidden>重新检查会话</button>
        <form id="login-form" hidden>
          <label for="account">账号</label>
          <input id="account" name="username" autocomplete="username" required spellcheck="false" autocapitalize="none" placeholder="请输入账号">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
          <p id="request-note" class="request-note" hidden></p>
          <button id="submit" class="primary" type="submit">登录</button>
        </form>
        <p class="privacy-note">会话仅保存在当前标签页。使用公共设备后，请主动退出登录。</p>
        <noscript><p class="message">请启用 JavaScript 后登录。</p></noscript>
      </div>
    </section>
  </main>
</body>
</html>
