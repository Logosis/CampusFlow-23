[project]
name = "campusflow-23"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "argon2-cffi>=23.1,<26",
  "tzdata>=2025.1",
]
[dependency-groups]
dev = ["pytest>=8.3,<10"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: real services and PostgreSQL required"]
