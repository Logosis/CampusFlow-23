server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /api/v1/d/ { proxy_pass http://d:8000; proxy_read_timeout 10s; }
    location /api/v1/m1/ { proxy_pass http://m1:8000; proxy_read_timeout 10s; }
    location /api/v1/m2/ { proxy_pass http://m2:8000; proxy_read_timeout 10s; }
    location /api/v1/m3/ { proxy_pass http://m3:8000; proxy_read_timeout 10s; }
}
